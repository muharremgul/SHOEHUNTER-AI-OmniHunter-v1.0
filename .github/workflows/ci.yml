name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --upgrade pip pip-audit
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m compileall -q backend
      - run: python scripts/check_version.py
      - run: ruff check backend --select E9,F63,F7,F82
      - run: black --check backend/security.py backend/product_identity.py backend/alerting.py backend/job_queue.py backend/discovery_service.py backend/tests
      - run: mypy --follow-imports=skip backend/security.py backend/product_identity.py backend/alerting.py backend/job_queue.py
      - run: pytest -q -m "not live"
      - run: pip-audit -r backend/requirements.txt --progress-spinner=off

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm test -- --watchAll=false --passWithNoTests
      - working-directory: frontend
        run: npm run build
      - working-directory: frontend
        run: npm audit --omit=dev --audit-level=critical

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
