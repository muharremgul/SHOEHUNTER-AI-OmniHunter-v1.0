[project]
name = "shoehunter-ai"
version = "0.4.5"
description = "Local Flask app for tracking shoe listings, prices, and alerts."
requires-python = ">=3.11"
dependencies = []

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
